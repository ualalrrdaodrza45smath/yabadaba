```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTING!!</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        background: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #222;
    }

    .chat {
        width: min(650px, 92vw);
        height: min(720px, 88vh);
        background: white;
        border-radius: 22px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .messages {
        flex: 1;
        position: relative;
        overflow-y: auto;
        padding: 25px;
    }

    .welcome {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
    }

    .welcome h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .welcome p {
        margin: 8px 0 0;
        color: #888;
        font-size: 15px;
    }

    .message {
        width: fit-content;
        max-width: 80%;
        margin-bottom: 12px;
        padding: 11px 15px;
        border-radius: 17px;
        background: #eeeeee;
        line-height: 1.4;
        word-wrap: break-word;
    }

    .message.user {
        margin-left: auto;
        background: #222;
        color: white;
    }

    .composer {
        padding: 16px;
        border-top: 1px solid #eeeeee;
        display: flex;
        gap: 10px;
    }

    .composer input {
        flex: 1;
        border: 1px solid #ddd;
        outline: none;
        border-radius: 14px;
        padding: 13px 15px;
        font-size: 15px;
        background: #fafafa;
    }

    .composer input:focus {
        border-color: #aaa;
        background: white;
    }

    .composer button {
        border: none;
        border-radius: 14px;
        padding: 0 20px;
        background: #222;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    .composer button:hover {
        background: #444;
    }

    .composer button:active {
        transform: scale(0.97);
    }
</style>
</head>

<body>

<div class="chat">

    <div class="messages" id="messages">

        <div class="welcome" id="welcome">
            <div>
                <h1>TESTING!!</h1>
                <p>Send a message to get started.</p>
            </div>
        </div>

    </div>

    <div class="composer">
        <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

const DISCORD_WEBHOOK = "PASTE_YOUR_WEBHOOK_HERE";

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    const text = input.value.trim();

    if (!text) return;

    // Hide welcome screen
    welcome.style.display = "none";

    // Add message to chat
    const message = document.createElement("div");
    message.className = "message user";
    message.textContent = text;

    messages.appendChild(message);

    // Clear input
    input.value = "";

    // Scroll to newest message
    messages.scrollTop = messages.scrollHeight;

    // Send message to Discord
    try {
        await fetch(DISCORD_WEBHOOK, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content: text
            })
        });
    } catch (error) {
        console.error("Message could not be sent.");
    }
}

// Press Enter to send
document.getElementById("messageInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }

});

</script>

</body>
</html>
